[project]
name = "ercot-bdm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gridstatus",
    "pandas",
    "pyarrow",
    "duckdb",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
